name: Rebuild Linux Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to replace assets in
        required: true
        default: "1.2.60"
      source_ref:
        description: Branch or commit to build
        required: true
        default: "komari-agent-1.2.60"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.release_tag }}
        run: |
          set -euxo pipefail
          BINARY_NAME="komari-agent-linux-${GOARCH}"
          go build -trimpath -ldflags="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" -o "${BINARY_NAME}"

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euxo pipefail
          BINARY_NAME="komari-agent-linux-${{ matrix.goarch }}"
          gh release upload "${RELEASE_TAG}" "${BINARY_NAME}" --clobber --repo "${{ github.repository }}"
